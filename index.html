    </div>
    <div class="container" style="display: none;" id="singlePlayer">

        <h1>CPM Calculator (SinglePlayer)</h1>

        <span class="spanclick">Click the button to start!</span><br><br>

        <button class="btn-class-name"  id="clickArea" onclick="handleClick()">

            <span class="back"></span> 

            <span class="front"></span>

        </button>

        <!-- <div id="clickArea" onclick="handleClick()">

            <div id="clickText">Click Me!</div>

        </div> -->

        <div id="clickText2"></div>

        <div id="clickText3"></div>

        <div id="clickCounter">0 clicks</div>

        <div id="timer">Time: 

            <select id="timerselect" class="timerselect">

                <option value="10">10s</option>

                <option value="20">20s</option>

                <option value="30">30s</option>

                <option value="40">40s</option>

                <option value="50">50s</option>

                <option value="60">1m</option>

            </select>

        </div>

        <div style="display: none;" id="divrestart">

            <br><br>

            <button class="button" onclick="restartGame()">Restart</button>

        </div>

    </div>

    <div class="container" style="display: none;margin: auto;" id="multiPlayer" >

        <h1 style="margin-top: 0px;margin-bottom: 25px;">CPM Calculator (Multiplayer)</h1>
        <div id="playerone" style="transform: rotate(180deg);margin-bottom: 50px;">

        
            <span class="spanclick">Click the button to start!</span><br><br>

            <button class="btn-class-name" style="width: 150px;height: 120px;" id="clickArea2" onclick="handleClickmulti()">

                <span class="back"></span> 

                <span class="front"></span>

            </button>

            <!-- <div id="clickArea" onclick="handleClick()">

                <div id="clickText">Click Me!</div>

            </div> -->

            <div id="clickText22"></div>

            <div id="clickText33"></div>

            <div id="clickCounter22">0 clicks</div>

            <div id="timer22">Time: 

              

            </div>

            <div style="display: none;" id="divrestart2">

                <br><br>

                <button class="button" onclick="restartGame()">Restart</button>

            </div>
        </div>

        <!-- PLAYER TWO -->

        <div id="playertwo">

        
            <span class="spanclick">Click the button to start!</span><br><br>

            <button class="btn-class-name"  style="width: 150px;height: 120px;" id="clickArea3" onclick="handleClickmulti2()">

                <span class="back"></span> 

                <span class="front"></span>

            </button>


            <div id="clickText222"></div>

            <div id="clickText333"></div>

            <div id="clickCounter222">0 clicks</div>

            <div id="timer2">Time: 

                <select id="timerselect2" class="timerselect">

                    <option value="10">10s</option>

                    <option value="20">20s</option>

                    <option value="30">30s</option>

                    <option value="40">40s</option>

                    <option value="50">50s</option>

                    <option value="60">1m</option>

                </select>

            </div>

            <div style="display: none;" id="divrestart22">

                <br><br>

                <button class="button" onclick="restartGame()">Restart</button>

            </div>
        </div>


    </div>
